name: AgentPM Registry Build and Audit

on:
  push:
    branches:
      - main
    paths:
      - 'packages/registry/packages/**'
  pull_request:
    paths:
      - 'packages/registry/packages/**'
  workflow_dispatch:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build AgentPM Monorepo
        run: npm run build

      - name: Audit all packages in registry
        run: |
          echo "Running AgentPM Security Audit on Registry..."
          node packages/cli/dist/index.js audit packages/registry/packages
